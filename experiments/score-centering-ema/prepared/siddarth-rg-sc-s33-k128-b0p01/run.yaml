apiVersion: batch/v1
kind: Job
metadata:
  name: siddarth-rg-sc-s33-k128-b0p01
  namespace: siddarth
  labels:
    kueue.x-k8s.io/queue-name: gpu
spec:
  suspend: true
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimit: 0
  activeDeadlineSeconds: 259200
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: run
        image: primeintellect/prime-rl@sha256:e175fb968a270de9450cde72817ebac0a97087fbfc3b7765f1c10cc5b5886209
        workingDir: /data/siddarth-sc-ema
        command:
        - bash
        - -lc
        args:
        - set -eu; uv sync --all-extras --frozen; exec uv run --no-sync python experiments/score-centering-ema/launch.py
        env:
        - name: UV_PROJECT_ENVIRONMENT
          value: /app/.venv
        - name: UV_CACHE_DIR
          value: /data/cache/uv
        - name: HF_HOME
          value: /data/cache/huggingface
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VERIFIERS
          value: 0.1.15.dev411
        - name: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_RENDERERS
          value: 0.1.8.dev28
        - name: WANDB_MODE
          value: online
        - name: NCCL_DEBUG
          value: INFO
        - name: VLLM_ENGINE_READY_TIMEOUT_S
          value: '4200'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        - name: RESEARCH_RUN_NAME
          value: siddarth-rg-sc-s33-k128-b0p01
        - name: RESEARCH_SEED
          value: '33'
        - name: RESEARCH_CONFIG_DIR
          value: /data/siddarth-sc-ema/experiments/score-centering-ema/prepared/siddarth-rg-sc-s33-k128-b0p01
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: siddarth-wandb
              key: api-key
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
        resources:
          requests: &id001
            cpu: '32'
            memory: 256Gi
            nvidia.com/gpu: 8
            nvidia.com/hostdev: 8
          limits: *id001
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: shared
          mountPath: /data
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: shared
        persistentVolumeClaim:
          claimName: prime-values-shared
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
