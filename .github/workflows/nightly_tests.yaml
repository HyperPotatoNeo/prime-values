name: Historical Runtime Tests (manual, frozen source)

# The native branch's automatic lifecycle gate lives in gpu_tests.yaml.
# These preserved legacy/SFT/benchmark/MM tests execute the historical runtime;
# success here is never evidence about the current branch's implementation.
on:
  workflow_dispatch:
    inputs:
      test_file:
        description: "Historical test on fixed source 1801d112; no universal compatibility guarantee"
        required: true
        type: choice
        default: tests/integration/test_reverse_text.py
        options:
          - tests/integration/test_reverse_text.py
          - tests/integration/test_reverse_text_sft.py
          - tests/integration/test_reverse_text_sft_lora.py
          - tests/integration/test_reverse_text_rl_opd.py
          - tests/integration/test_reverse_text_rl_sft.py
          - tests/integration/test_alphabet_sort.py
          - tests/integration/test_reverse_text_lora.py
          - tests/integration/test_reverse_text_moe.py
          - tests/integration/test_reverse_text_multi_run.py
          - tests/integration/test_benchmark_regression.py
          - tests/nightly/test_hendrycks_sanity.py
          - tests/nightly/test_wordle.py
          - tests/nightly/test_wiki_search.py
          - tests/nightly/test_multimodal_color_codeword.py
          - tests/nightly/test_reverse_text.py
          - tests/nightly/test_alphabet_sort.py
          - tests/unit

jobs:
  historical-test:
    name: Historical 1801d112 (${{ inputs.test_file }})
    runs-on: ${{ inputs.test_file == 'tests/unit' && 'vm' || startsWith(inputs.test_file, 'tests/nightly/') && 'research-cluster' || '4xa6000' }}
    container:
      image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
      options: --gpus all --shm-size=16g
    timeout-minutes: 1440
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout the explicitly frozen historical runtime
        uses: actions/checkout@v4
        with:
          ref: 1801d1129f1adeeed6dcfabb0295451e4b5cb4b8
          submodules: false
      - name: Verify historical source and initialize its own dependencies
        run: |
          test "$(git rev-parse HEAD)" = 1801d1129f1adeeed6dcfabb0295451e4b5cb4b8
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive -- deps/verifiers deps/renderers deps/research-environments deps/pydantic-config
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install the historical lock
        run: uv sync --all-extras --locked
      - name: Execute the preserved historical assertions
        env:
          HISTORICAL_TEST_FILE: ${{ inputs.test_file }}
          USERNAME_CI: CI_RUNNER
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_MODE: ${{ secrets.WANDB_API_KEY && 'online' || 'offline' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRIME_BASE_URL: ${{ secrets.PRIME_BASE_URL }}
          PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
          PYTEST_OUTPUT_DIR: /tmp/outputs
          VLLM_WORKER_MULTIPROC_METHOD: spawn
        run: |
          if [ "$HISTORICAL_TEST_FILE" = tests/unit ]; then
            uv run pytest tests/unit -m gpu
          else
            uv run pytest -vvs "$HISTORICAL_TEST_FILE"
          fi
