name: GPU Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: vm
    container:
      image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
      options: --gpus all --shm-size=16g
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init public submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive -- deps/verifiers deps/renderers deps/research-environments deps/pydantic-config
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Run unit tests
        env:
          USERNAME_CI: CI_RUNNER
          WANDB_MODE: offline
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PYTEST_OUTPUT_DIR: /tmp/outputs
        run: uv run pytest tests/unit -m gpu

  integration-tests:
    name: Integration tests (${{ matrix.test }})
    runs-on: ${{ matrix.runner }}
    container:
      image: pytorch/pytorch:2.10.0-cuda13.0-cudnn9-devel
      options: --gpus all --shm-size=16g
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: native_policy_fresh_resume
            runner: 4xa6000
            pytest_args: "tests/integration/test_native_profile.py::test_native_policy_fresh_resume"
          - test: native_value_fresh_resume
            runner: 4xa6000
            pytest_args: "tests/integration/test_native_profile.py::test_native_value_fresh_resume"
    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init public submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive -- deps/verifiers deps/renderers deps/research-environments deps/pydantic-config
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --all-extras --locked
      - name: Run integration tests
        env:
          USERNAME_CI: CI_RUNNER
          WANDB_MODE: offline
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
          PRIME_BASE_URL: ${{ secrets.PRIME_BASE_URL }}
          PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PYTEST_OUTPUT_DIR: /tmp/outputs
          VLLM_WORKER_MULTIPROC_METHOD: spawn
        # These are lifecycle checks, not historical convergence benchmarks.
        # RG requires an externally pinned cache and is not claimed by this job.
        run: uv run pytest -vvs --basetemp=/tmp/native-ci ${{ matrix.pytest_args }}
      - name: Preserve native lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-lifecycle-${{ matrix.test }}
          if-no-files-found: warn
          path: |
            /tmp/native-ci/**/fresh/**
            /tmp/native-ci/**/resumed/**
