[project]
name = "rg-mix-env"
version = "0.1.6.dev0"
description = "Cached reasoning-gym mix for the native producer profile; legacy source retained for the frozen runtime"
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.1.dev39", "reasoning-gym==0.1.25", "datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["rg_mix_env.py", "rg_mix_shared.py", "rg_mix_v1"]

[tool.hatch.build.targets.sdist]
include = ["rg_mix_env.py", "rg_mix_shared.py", "rg_mix_v1", "generate_rg_mix_dataset.py", "README.md", "pyproject.toml"]
